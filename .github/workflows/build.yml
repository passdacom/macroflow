name: Build MacroFlow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.11.8"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra ui-test --python 3.11

      - name: Install Qt runtime library
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Validate GitHub Actions workflow
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          actionlint .github/workflows/build.yml
          uvx --from zizmor==1.28.0 zizmor --min-severity medium .github/workflows/build.yml

      - name: Run ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy src/

      - name: Run pytest
        run: uv run pytest tests/ -v

  build-exe:
    name: Build Windows EXE
    needs: lint-test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
        with:
          version: "0.11.8"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra ui-test --python 3.11

      - name: Run pytest on Windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest tests/ -v

      # pyproject.toml에서 버전을 읽어 EXE 파일명에 반영
      - name: Get version
        id: get_version
        shell: python
        run: |
          import re, os
          text = open("pyproject.toml", encoding="utf-8").read()
          m = re.search(r'^version\s*=\s*"([^"]+)"', text, re.MULTILINE)
          version = m.group(1) if m else "0.0.0"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={version}\n")

      - name: Build EXE
        run: uv run pyinstaller build/macroflow-win.spec

      # 파일명에 버전과 빌드 번호 포함: MacroFlow-v0.2.0-build42.exe
      - name: Rename EXE with version
        shell: bash
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          BUILD: ${{ github.run_number }}
        run: |
          mv dist/MacroFlow.exe "dist/MacroFlow-v${VERSION}-build${BUILD}.exe"

      - name: Write checksum and provenance
        shell: pwsh
        run: |
          $exe = Get-ChildItem 'dist/MacroFlow-v*.exe' | Select-Object -First 1
          $hash = (Get-FileHash -Algorithm SHA256 $exe.FullName).Hash.ToLowerInvariant()
          Set-Content -Encoding ascii "$($exe.FullName).sha256" "$hash  $($exe.Name)"
          @(
            "commit=$env:GITHUB_SHA"
            "run_id=$env:GITHUB_RUN_ID"
            "run_number=$env:GITHUB_RUN_NUMBER"
            "repository=$env:GITHUB_REPOSITORY"
          ) | Set-Content -Encoding ascii "$($exe.FullName).provenance.txt"

      - name: Smoke packaged EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Get-ChildItem 'dist/MacroFlow-v*.exe' | Select-Object -First 1).FullName
          $process = Start-Process -FilePath $exe -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          $window = $null
          $ownedIds = [System.Collections.Generic.HashSet[int]]::new()
          [void]$ownedIds.Add($process.Id)
          try {
            do {
              if ($process.HasExited) {
                throw "Packaged EXE exited during startup with code $($process.ExitCode)"
              }
              do {
                $added = $false
                Get-CimInstance Win32_Process | Where-Object {
                  $ownedIds.Contains([int]$_.ParentProcessId)
                } | ForEach-Object {
                  if ($ownedIds.Add([int]$_.ProcessId)) { $added = $true }
                }
              } while ($added)
              $window = Get-Process -Id @($ownedIds) -ErrorAction SilentlyContinue |
                Where-Object { $_.MainWindowHandle -ne 0 } |
                Select-Object -First 1
              if ($window) { break }
              Start-Sleep -Milliseconds 500
              $process.Refresh()
            } while ((Get-Date) -lt $deadline)
            if (-not $window) {
              throw 'Packaged EXE did not expose a MacroFlow main window within 30 seconds'
            }
            Write-Host "PACKAGED_EXE_SMOKE_OK title=$($window.MainWindowTitle) pid=$($window.Id)"
          }
          finally {
            & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MacroFlow-exe
          path: dist/MacroFlow-v*
          retention-days: 30

  release:
    name: Create Release
    needs: build-exe
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download EXE artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: MacroFlow-exe
          path: dist/

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.build-exe.outputs.version }}-build${{ github.run_number }}
          name: "MacroFlow v${{ needs.build-exe.outputs.version }} Build ${{ github.run_number }}"
          files: dist/MacroFlow-v*
          body: |
            Source commit: `${{ github.sha }}`
            Workflow run: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`
            Verify the EXE with the attached `.sha256` file.
          generate_release_notes: true
          make_latest: true
