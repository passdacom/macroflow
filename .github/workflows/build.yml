name: Build MacroFlow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint & Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.8"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11.15

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra ui-test --python 3.11.15

      - name: Install Qt runtime library
        run: sudo apt-get update && sudo apt-get install --yes libegl1

      - name: Validate GitHub Actions workflow
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" .github/workflows/build.yml
          uvx --from zizmor==1.28.0 zizmor --min-severity medium .github/workflows/build.yml

      - name: Run ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy src/

      - name: Run pytest
        run: uv run pytest tests/ -v

  build-exe:
    name: Build Windows EXE
    needs: lint-test
    runs-on: windows-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.11.8"
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11.15

      - name: Install dependencies
        run: uv sync --locked --extra dev --extra ui-test --python 3.11.15

      - name: Run pytest on Windows
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest tests/ -v

      # pyproject.toml에서 버전을 읽어 EXE 파일명에 반영
      - name: Get version
        id: get_version
        shell: python
        run: |
          import re, os
          text = open("pyproject.toml", encoding="utf-8").read()
          m = re.search(r'^version\s*=\s*"([^"]+)"', text, re.MULTILINE)
          version = m.group(1) if m else "0.0.0"
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={version}\n")

      - name: Build EXE
        run: uv run pyinstaller build/macroflow-win.spec

      # 파일명에 버전과 빌드 번호 포함: MacroFlow-v0.2.0-build42.exe
      - name: Rename EXE with version
        shell: bash
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          BUILD: ${{ github.run_number }}
        run: |
          mv dist/MacroFlow/MacroFlow.exe "dist/MacroFlow/MacroFlow-v${VERSION}-build${BUILD}.exe"

      - name: Verify replaceable Qt runtime layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Get-ChildItem 'dist/MacroFlow/MacroFlow-v*.exe' | Select-Object -First 1).FullName
          foreach ($dll in @('Qt6Core.dll', 'Qt6Gui.dll', 'Qt6Widgets.dll')) {
            if (-not (Get-ChildItem 'dist/MacroFlow' -Recurse -File -Filter $dll | Select-Object -First 1)) {
              throw "Replaceable Qt runtime file is missing: $dll"
            }
          }
          $embedded = (uv run pyi-archive_viewer --list $exe | Out-String)
          if ($embedded -match 'Qt6(?:Core|Gui|Widgets)\.dll') {
            throw 'Qt runtime DLLs must remain outside the executable for LGPL replacement rights'
          }

      - name: Smoke packaged EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Get-ChildItem 'dist/MacroFlow/MacroFlow-v*.exe' | Select-Object -First 1).FullName
          $process = Start-Process -FilePath $exe -PassThru
          $deadline = (Get-Date).AddSeconds(30)
          $window = $null
          $ownedIds = [System.Collections.Generic.HashSet[int]]::new()
          [void]$ownedIds.Add($process.Id)
          try {
            do {
              if ($process.HasExited) {
                throw "Packaged EXE exited during startup with code $($process.ExitCode)"
              }
              do {
                $added = $false
                Get-CimInstance Win32_Process | Where-Object {
                  $ownedIds.Contains([int]$_.ParentProcessId)
                } | ForEach-Object {
                  if ($ownedIds.Add([int]$_.ProcessId)) { $added = $true }
                }
              } while ($added)
              $window = Get-Process -Id @($ownedIds) -ErrorAction SilentlyContinue |
                Where-Object {
                  $_.MainWindowHandle -ne 0 -and $_.MainWindowTitle -like 'MacroFlow*'
                } |
                Select-Object -First 1
              if ($window) { break }
              Start-Sleep -Milliseconds 500
              $process.Refresh()
            } while ((Get-Date) -lt $deadline)
            if (-not $window) {
              throw 'Packaged EXE did not expose a MacroFlow main window within 30 seconds'
            }
            Write-Host "PACKAGED_EXE_SMOKE_OK title=$($window.MainWindowTitle) pid=$($window.Id)"
          }
          finally {
            & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
          }

      - name: Smoke packaged inline sequence codec
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Get-ChildItem 'dist/MacroFlow/MacroFlow-v*.exe' | Select-Object -First 1).FullName
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-inline-sequence' -PassThru
          try {
            if (-not $process.WaitForExit(30000)) {
              & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
              throw "Packaged inline sequence smoke timed out after 30 seconds"
            }
            $process.Refresh()
            if ($process.ExitCode -ne 0) {
              throw "Packaged inline sequence smoke failed with code $($process.ExitCode)"
            }
            Write-Host "PACKAGED_INLINE_SEQUENCE_SMOKE_OK sha256=$hash pid=$($process.Id)"
          }
          finally {
            if (-not $process.HasExited) {
              & taskkill.exe /PID $process.Id /T /F 2>$null | Out-Null
            }
          }

      - name: Build GPL distribution bundle
        shell: pwsh
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          BUILD: ${{ github.run_number }}
          PYTHON_BUILD_SOURCE_SHA256: 8f012da286789efb4916bdc7fdd85af15a8ff616de559f99c0c63067a821506c
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Get-ChildItem 'dist/MacroFlow/MacroFlow-v*.exe' | Select-Object -First 1).FullName
          $appDir = (Resolve-Path 'dist/MacroFlow').Path
          $sourceDateEpoch = (git show -s --format=%ct $env:GITHUB_SHA).Trim()
          $pythonBuildSourceName = 'python-build-standalone-20260414-7af98d60e411de479ab16f5537efc7184dffc25a.tar.gz'
          $pythonBuildSource = Join-Path $env:RUNNER_TEMP $pythonBuildSourceName
          Invoke-WebRequest `
            -Uri 'https://codeload.github.com/astral-sh/python-build-standalone/tar.gz/7af98d60e411de479ab16f5537efc7184dffc25a' `
            -OutFile $pythonBuildSource
          $pythonBuildSourceHash = (Get-FileHash -Algorithm SHA256 $pythonBuildSource).Hash.ToLowerInvariant()
          if ($pythonBuildSourceHash -cne $env:PYTHON_BUILD_SOURCE_SHA256) {
            throw "python-build-standalone source hash mismatch: $pythonBuildSourceHash"
          }
          $inventory = Join-Path $env:RUNNER_TEMP 'macroflow-pyinstaller-contents.txt'
          uv run pyi-archive_viewer --list $exe | Out-File -Encoding utf8 $inventory
          Get-ChildItem 'dist/MacroFlow' -Recurse -File | ForEach-Object {
            $_.FullName.Substring($appDir.Length + 1).Replace('\\', '/')
          } | Sort-Object | Add-Content -Encoding utf8 $inventory
          uv run python tools/build_release_bundle.py `
            --exe $exe `
            --app-dir $appDir `
            --archive-inventory $inventory `
            --repository $env:GITHUB_REPOSITORY `
            --commit $env:GITHUB_SHA `
            --tag "v$env:VERSION-build$env:BUILD" `
            --run-id $env:GITHUB_RUN_ID `
            --run-number $env:GITHUB_RUN_NUMBER `
            --source-date-epoch $sourceDateEpoch `
            --output-dir release
          Copy-Item $pythonBuildSource 'release/'
          "$pythonBuildSourceHash  $pythonBuildSourceName" | Set-Content `
            -Encoding ascii "release/$pythonBuildSourceName.sha256"

      - name: Upload GPL release artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: MacroFlow-gpl-release
          path: release/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create Release
    needs: build-exe
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download GPL release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: MacroFlow-gpl-release
          path: release/

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: v${{ needs.build-exe.outputs.version }}-build${{ github.run_number }}
          name: "MacroFlow v${{ needs.build-exe.outputs.version }} Build ${{ github.run_number }}"
          files: release/*
          body: |
            MacroFlow is free software distributed under GNU GPLv3.

            Source commit: `${{ github.sha }}`
            Exact corresponding source: `${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}`
            Workflow run: `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`

            Download the `-GPL.zip` bundle, which includes the executable, SPDX SBOM,
            third-party notices, license texts, PyInstaller inventory, and source instructions.
            The pinned `python-build-standalone` corresponding-source archive and its SHA-256
            checksum are attached as separate assets.
            Verify the ZIP with the attached `.sha256` file.
          generate_release_notes: true
          make_latest: true
